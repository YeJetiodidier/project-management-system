<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager – ProManage</title>
  <meta name="description" content="Task manager page for ProManage with task overview, filters, and active work items." />
  <link rel="stylesheet" href="css/dashbord.css" />
  <link rel="stylesheet" href="css/task.css" />
  <script src="js/nav.js" defer></script>
  <script src="js/task.js" defer></script>
</head>
<body>

  <aside class="sidebar" id="sidebar">

    <a href="dashbord_manager.html" class="sidebar-brand">
      <img src="assets/images/brand-logo.png" alt="ProManage" />
      <span class="sidebar-brand-name">ProManage</span>
    </a>

    <nav class="sidebar-nav" aria-label="Manager navigation">
      <span class="nav-section-label">Main</span>

      <a href="dashbord_manager.html" class="nav-item" id="nav-dashboard">
        <span class="nav-icon">🏠</span> Dashboard
      </a>

      <a href="project.html" class="nav-item" id="nav-projects">
        <span class="nav-icon">📁</span> Projects
        <span class="nav-badge" id="badge-projects">4</span>
      </a>

      <a href="task.html" class="nav-item active" id="nav-tasks">
        <span class="nav-icon">✅</span> Tasks
        <span class="nav-badge" id="badge-tasks">12</span>
      </a>

      <a href="team.html" class="nav-item" id="nav-team">
        <span class="nav-icon">👥</span> Team
      </a>

      <a href="files.html" class="nav-item" id="nav-files">
        <span class="nav-icon">📎</span> Files
      </a>

      <span class="nav-section-label" style="margin-top:12px;">Analytics</span>

      <a href="#" class="nav-item" id="nav-worklogs">
        <span class="nav-icon">📊</span> Work Logs
      </a>

      <a href="#" class="nav-item" id="nav-performance">
        <span class="nav-icon">📈</span> Performance
      </a>

      <span class="nav-section-label" style="margin-top:12px;">Account</span>

      <a href="notification.html" class="nav-item" id="nav-notifications">
        <span class="nav-icon">🔔</span> Notifications
        <span class="nav-badge" id="badge-notif">3</span>
      </a>

      <a href="profile.html" class="nav-item" id="nav-profile">
        <span class="nav-icon">👤</span> Profile
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="profile.html" class="sidebar-user" title="View profile">
        <div class="sidebar-user-avatar" id="sidebarAvatar">M</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebarName">Manager</div>
          <div class="sidebar-user-role">Project Manager</div>
        </div>
        <span style="color:var(--text-muted);font-size:14px;">⚙️</span>
      </a>
    </div>

  </aside>

  <div class="dashboard-root">

    <header class="topbar">
      <h1 class="topbar-title">TASK ASSIGNMENT</h1>

      <div class="topbar-search">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search tasks…" />
      </div>

      <button class="btn-primary" id="openModalBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Task
      </button>
    </header>

    <main class="main-content" id="mainContent">

      <section class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
        <div class="stat-card stat-todo">
          <span class="stat-label">To-Do</span>
          <span class="stat-value" id="statTodo">0</span>
        </div>
        <div class="stat-card stat-progress">
          <span class="stat-label">In Progress</span>
          <span class="stat-value" id="statProgress">0</span>
        </div>
        <div class="stat-card stat-done">
          <span class="stat-label">Done</span>
          <span class="stat-value" id="statDone">0</span>
        </div>
      </section>

      <section class="filters-bar">
        <div class="filter-group">
          <label>Status</label>
          <select id="filterStatus">
            <option value="all">All Statuses</option>
            <option value="todo">To-Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Priority</label>
          <select id="filterPriority">
            <option value="all">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Sort by</label>
          <select id="sortBy">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="duedate">Due Date</option>
            <option value="priority">Priority</option>
          </select>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="viewList" title="List view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-btn" id="viewGrid" title="Grid view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
      </section>

      <section class="dash-card task-card">
        <div class="task-container">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="12" y1="9" x2="12" y2="15"/></svg>
            </div>
            <p class="empty-title">No tasks yet</p>
            <p class="empty-sub">Click <strong>New Task</strong> to get started</p>
          </div>
          <div class="task-list" id="taskList"></div>
        </div>
      </section>

    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Task</h2>
        <button class="modal-close" id="closeModalBtn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editTaskId" />
        <div class="form-group">
          <label for="taskTitle">Task Title <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="Enter task title…" />
        </div>
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" rows="3" placeholder="Add a brief description…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskStatus">Status</label>
            <input type="hidden" id="taskStatus" value="todo" />
            <div class="status-display">To-Do</div>
          </div>
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskDue">Due Date</label>
            <input type="date" id="taskDue" />
          </div>
          <div class="form-group">
            <label for="taskAssignee">Assigned To</label>
            <input type="text" id="taskAssignee" placeholder="UserID" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn-primary" id="saveTaskBtn">Save Task</button>
      </div>
    </div>
  </div>

</body>
</html>
