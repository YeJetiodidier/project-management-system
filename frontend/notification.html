<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | ProManage</title>
  <meta name="description" content="View notifications across all your assigned projects." />
  <link rel="stylesheet" href="css/dashbord.css" />
  <link rel="stylesheet" href="css/notification.css" />
  <script src="js/nav.js" defer></script>
</head>
<body>

  <!-- ══════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <a href="dashbord_manager.html" class="sidebar-brand">
      <img src="assets/images/brand-logo.png" alt="ProManage" />
      <span class="sidebar-brand-name">ProManage</span>
    </a>

    <nav class="sidebar-nav" aria-label="Manager navigation">
      <span class="nav-section-label">Main</span>

      <a href="dashbord_manager.html" class="nav-item" id="nav-dashboard">
        <span class="nav-icon">🏠</span> Dashboard
      </a>

      <a href="project.html" class="nav-item" id="nav-projects">
        <span class="nav-icon">📁</span> Projects
        <span class="nav-badge" id="badge-projects">0</span>
      </a>

      <a href="task.html" class="nav-item" id="nav-tasks">
        <span class="nav-icon">✅</span> Tasks
        <span class="nav-badge" id="badge-tasks">0</span>
      </a>

      <a href="team.html" class="nav-item" id="nav-team">
        <span class="nav-icon">👥</span> Team
      </a>

      <a href="files.html" class="nav-item" id="nav-files">
        <span class="nav-icon">📎</span> Files
      </a>

      <span class="nav-section-label" style="margin-top:12px;">Analytics</span>

      <a href="#" class="nav-item" id="nav-worklogs">
        <span class="nav-icon">📊</span> Work Logs
      </a>

      <a href="#" class="nav-item" id="nav-performance">
        <span class="nav-icon">📈</span> Performance
      </a>

      <span class="nav-section-label" style="margin-top:12px;">Account</span>

      <a href="notification.html" class="nav-item active" id="nav-notifications">
        <span class="nav-icon">🔔</span> Notifications
        <span class="nav-badge" id="badge-notif">0</span>
      </a>

      <a href="profile.html" class="nav-item" id="nav-profile">
        <span class="nav-icon">👤</span> Profile
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="profile.html" class="sidebar-user" title="View profile">
        <div class="sidebar-user-avatar" id="sidebarAvatar">M</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebarName">Manager</div>
          <div class="sidebar-user-role">Project Manager</div>
        </div>
        <span style="color:var(--text-muted);font-size:14px;">⚙️</span>
      </a>
    </div>

  </aside>

  <!-- ══════════════════════════════════════
       MAIN AREA
  ══════════════════════════════════════ -->
  <div class="dashboard-root">

    <!-- Topbar -->
    <header class="topbar">
      <h1 class="topbar-title">Notifications</h1>
      <!-- Profile avatar -->
      <a href="profile.html" class="topbar-avatar" id="topbarAvatar" title="Profile">M</a>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="notif-container">

        <!-- Header -->
        <div class="notif-header-wrap">
          <h2>Your Updates</h2>
          <button class="mark-read-btn" id="markAllReadBtn">Mark all as read</button>
        </div>

        <!-- Filters -->
        <div class="notif-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="unread">Unread</button>
          <button class="filter-btn" data-filter="mentions">Mentions</button>
        </div>

        <!-- Notification List -->
        <div class="notif-list" id="notifList">
          <p style="color:var(--text-muted);padding:16px;">Loading…</p>
        </div> <!-- /notif-list -->

      </div>
    </main>
  </div>

  <script src="js/notification.js"></script>
</body>
</html>
